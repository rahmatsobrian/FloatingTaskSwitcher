name: Android CI Build

on:
  push:
  pull_request:
  workflow_dispatch:

# No repo secrets are used anywhere in this workflow. Everything below runs
# with only the automatically-provided, read-only GITHUB_TOKEN permission.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships with an Android SDK, so no ANDROID_HOME
      # secret or manual SDK install is needed.
      - name: Confirm Android SDK is available
        run: echo "ANDROID_HOME=$ANDROID_HOME"

      # The repo intentionally does not commit gradlew / gradle-wrapper.jar.
      # gradle/actions/setup-gradle installs a real Gradle binary on the PATH,
      # which we then use to generate the wrapper ourselves on the runner.
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # `set -o pipefail` + `tee` so the log file gets every line of output
      # AND the step's exit code still reflects a real build failure.
      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build-log.txt

      - name: Always save the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build-log.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Fail the job if the build actually failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "Build gagal. Buka tab Actions -> pilih run ini -> Artifacts -> unduh 'build-log-${{ github.run_number }}', lalu kirim file .txt-nya ke chat ini."
          exit 1
